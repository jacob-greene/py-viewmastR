[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "viewmastr"
version = "0.1.0"
description = "Python viewmastR: cell-type label transfer for single-cell RNA-seq, trained with the viewmastR burn backend"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jacob Greene" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "msgpack>=1.0",
]

[project.optional-dependencies]
tutorials = ["scanpy>=1.10", "jupyter", "nbconvert", "seaborn"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jacob-greene/py-viewmastR"
"R package" = "https://github.com/furlan-lab/viewmastR"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "python"
module-name = "viewmastr._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
