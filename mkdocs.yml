site_name: py-viewmastR
site_description: Cell-type label transfer for single-cell RNA-seq, in Python
site_url: https://jacob-greene.github.io/py-viewmastR/
repo_url: https://github.com/jacob-greene/py-viewmastR
repo_name: jacob-greene/py-viewmastR
edit_uri: ""
copyright: py-viewmastR is MIT licensed. Developed by Jacob Greene and Scott Furlan.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: Light mode}

# The tutorials live in tutorials/ (docs/tutorials is a link to it). Only the notebooks and
# their README are pages; the data loader and local paths stay out of the site.
exclude_docs: |
  tutorials/*.py
  tutorials/*.json
  tutorials/__pycache__/
  tutorials/data/
  tutorials/.ipynb_checkpoints/

hooks:
  - scripts/docs_hooks.py

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false          # render the stored outputs; never re-run the notebooks
      include_source: true
      ignore_h1_titles: false
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true    # signature as a code block (formatted by ruff if installed)
            line_length: 88
            docstring_style: numpy
            heading_level: 1    # each function has its own page; its name is the title
            members_order: source

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Reference:
      - reference/index.md
      - Training and inference:
          - viewmastR(): reference/viewmastR.md
          - viewmastR_infer(): reference/viewmastR_infer.md
          - setup_training(): reference/setup_training.md
          - get_weights(): reference/get_weights.md
          - TrainingSet: reference/TrainingSet.md
          - ViewmastrResult: reference/ViewmastrResult.md
      - Feature selection:
          - calculate_feature_dispersion(): reference/calculate_feature_dispersion.md
          - select_features(): reference/select_features.md
          - get_selected_features(): reference/get_selected_features.md
          - set_selected_features(): reference/set_selected_features.md
          - common_features(): reference/common_features.md
          - plot_feature_dispersion(): reference/plot_feature_dispersion.md
      - Bulk references, augmentation and deconvolution:
          - splat_bulk_reference(): reference/splat_bulk_reference.md
          - augment_data(): reference/augment_data.md
          - deconvolve_bulk(): reference/deconvolve_bulk.md
          - Deconvolution: reference/Deconvolution.md
      - Plotting:
          - confusion_matrix(): reference/confusion_matrix.md
          - plot_training_data(): reference/plot_training_data.md
          - plot_deconvolution(): reference/plot_deconvolution.md
      - Colours:
          - palette: reference/palette.md
      - Model files:
          - read_3file(): reference/read_3file.md
          - write_3file(): reference/write_3file.md
  - Articles:
      - tutorials/README.md
      - Get started:
          - How to use viewmastR: tutorials/01_how_to.ipynb
      - Advanced:
          - A deeper look at viewmastR: tutorials/02_in_depth.ipynb
          - Bulk dataset as a reference: tutorials/03_bulk_reference.ipynb
          - Augment data: tutorials/04_augment.ipynb
          - Saved models: tutorials/05_saved_model.ipynb
          - Extra functions: tutorials/06_extras.ipynb
          - Large query objects: tutorials/07_big_query.ipynb
          - Deconvolute bulk RNA-seq: tutorials/08_deconvolute.ipynb
  - Changelog: changelog.md
  - More:
      - Comparison with R: r_comparison.md
      - Benchmark: benchmark.md
      - Development: development.md
